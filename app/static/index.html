<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PitchLab</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body class="viz-root">
<header class="top">
  <a href="#/" class="brand">PitchLab</a>
  <nav>
    <a href="#/" data-nav="outliers">Slot outliers</a>
    <a href="#/velo" data-nav="velo">Perceived velo</a>
    <a href="#/stuff" data-nav="stuff">Stuff+</a>
    <a href="#/matter" data-nav="matter">What matters?</a>
  </nav>
  <div class="controls">
    <label>Season <select id="season"></select></label>
    <div class="search">
      <input id="search" type="search" placeholder="Find a pitcher" autocomplete="off">
      <ul id="search-results" hidden></ul>
    </div>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<main id="view"></main>
<div id="tooltip" class="tooltip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
